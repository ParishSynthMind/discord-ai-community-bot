<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ community }} admin</title>
<style>
 :root{--bg:#f6f7fb;--card:#fff;--ink:#1d2330;--muted:#6b7385;--line:#e3e6ee;--brand:#5865f2;--ok:#1f9d63;--warn:#c27c0e;--bad:#c4392f}
 *{box-sizing:border-box} body{margin:0;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
 header{background:#23272f;color:#fff;padding:14px 28px;display:flex;align-items:center;gap:26px}
 header b{font-size:16px} nav a{color:#c9cede;text-decoration:none;margin-right:16px;font-size:14px}
 nav a.on{color:#fff;border-bottom:2px solid var(--brand);padding-bottom:3px}
 header form{margin-left:auto} header button{background:none;border:1px solid #555c6b;color:#c9cede;border-radius:6px;padding:4px 10px;cursor:pointer}
 main{padding:24px 28px;max-width:1240px} h1{font-size:21px;margin:0 0 16px} h2{font-size:16px;margin:26px 0 10px}
 .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
 .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
 .tile .k{color:var(--muted);font-size:12.5px} .tile .v{font-size:25px;font-weight:600;margin-top:4px}
 .tile .v small{font-size:13px;color:var(--muted);font-weight:400}
 table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px}
 th{background:#eef0f6;text-align:left;padding:8px 10px;font-weight:600;color:#3b4252} td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
 .pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eef0f6}
 .active,.ok,.yes,.applied,.sent,.added{color:var(--ok)} .past_due,.queued_retry,.pending,.canceling{color:var(--warn)}
 .canceled,.lapsed,.failed,.dead,.unlinked,.no{color:var(--bad)}
 .mono{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12px;color:#4b5263}
 .note{color:var(--muted);font-size:13px;margin:4px 0 14px} .empty{color:var(--muted);padding:14px}
 button.act{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:5px 11px;cursor:pointer;font-size:13px}
</style></head><body>
<header><b>{{ community }}</b>
<nav>{% for key, label in [('overview','Overview'),('members','Members'),('payments','Payments'),('tickets','Tickets'),('audit','Audit log'),('reconcile','Role check')] %}
<a href="/admin{{ '' if key=='overview' else '/' + key }}" class="{{ 'on' if page==key }}">{{ label }}</a>{% endfor %}</nav>
<form method="post" action="/admin/logout"><button>Log out</button></form></header>
<main>{% block body %}{% endblock %}</main></body></html>
