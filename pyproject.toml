[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-ai-community-bot"
version = "0.1.0"
description = "A Discord community bot: Claude or Gemini answers from a knowledge base with sources, paid Premium roles synced from signed Stripe, Lemon Squeezy or Paddle webhooks, CRM and Calendly hooks, and an admin dashboard."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "discord.py>=2.5,<3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "anthropic>=2.0",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
community-bot = "community_bot.cli:main"

[tool.setuptools]
packages = ["community_bot"]

[tool.setuptools.package-data]
community_bot = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731"]
