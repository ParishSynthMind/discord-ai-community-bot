name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
          pip freeze | grep -i -E "uvicorn|websockets|discord|aiohttp|starlette|httpx|wsproto"
      - name: Lint
        run: ruff check .
      - name: Run tests (Discord, payments and the AI are faked, no keys needed)
        run: pytest -v --timeout 60 -o faulthandler_timeout=50
